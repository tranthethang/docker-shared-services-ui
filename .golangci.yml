version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - gosec
    - bodyclose
    - contextcheck
    - exhaustive
    - gocritic
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
